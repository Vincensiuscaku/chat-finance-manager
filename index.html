<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat dengan Finance Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
:root{color-scheme:light;--bg:#dcefe8;--bar:#0f6b5c;--barfg:#fff;--in:#ffffff;--out:#c6f0b5;--fg:#1c1c1c;--muted:#6b6b6b;--card:#fff;--line:#d9d9d9;--accent:#0f6b5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;background:#ffffff}
@media (max-width:560px){html,body{background:var(--bg)}}
body{color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--bar);color:var(--barfg);padding:10px 14px;display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:#f0b429;color:#3a2a00;display:grid;place-items:center;font-weight:700}
.nm{font-weight:600;line-height:1.2}.st{font-size:12px;opacity:.85}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;background:var(--card);color:var(--muted);font-size:12px;padding:3px 10px;border-radius:10px}
.b{max-width:min(82%,560px);padding:8px 11px 6px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.12);white-space:pre-wrap;animation:pop .2s ease}
.in{background:var(--in);align-self:flex-start;border-top-left-radius:3px}
.out{background:var(--out);align-self:flex-end;border-top-right-radius:3px}
.t{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.sender{font-size:12px;font-weight:600;color:var(--accent);display:block;margin-bottom:2px}
.typing{background:var(--in);align-self:flex-start;padding:10px 14px;border-radius:12px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.sol{align-self:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.sol h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
.sol ul,.sol ol{margin:4px 0 10px;padding-left:20px}
.sol p{margin:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px 0}
.chips button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:16px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button:hover{background:var(--accent);color:#fff}
form,.bar{display:flex;gap:8px;padding:8px 12px 10px}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font:inherit;background:var(--card);color:var(--fg);max-height:110px}
.send{border:0;background:var(--bar);color:#fff;width:44px;border-radius:50%;font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.b,.typing i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="av">FM</div>
    <div><div class="nm">Finance Manager</div><div class="st" id="status">online</div></div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <div class="bar">
    <textarea id="msg" rows="1" placeholder="Ketik jawaban Anda untuk manager..."></textarea>
    <button class="send" id="send" aria-label="Kirim">➤</button>
  </div>
</div>
<script>
var chat=document.getElementById('chat'),msg=document.getElementById('msg'),statusEl=document.getElementById('status');
var timers=[];
function now(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function scroll(){chat.scrollTop=chat.scrollHeight}
function bubble(text,cls,sender){
  var d=document.createElement('div');d.className='b '+cls;
  if(sender){var s=document.createElement('span');s.className='sender';s.textContent=sender;d.appendChild(s)}
  d.appendChild(document.createTextNode(text));
  var t=document.createElement('span');t.className='t';t.textContent=now();d.appendChild(t);
  chat.appendChild(d);scroll();return d;
}
function typing(){var d=document.createElement('div');d.className='typing';d.innerHTML='<i></i><i></i><i></i>';chat.appendChild(d);scroll();statusEl.textContent='sedang mengetik...';return d}
function incoming(text,delay,cb){
  var t=typing();
  timers.push(setTimeout(function(){t.remove();statusEl.textContent='online';bubble(text,'in','Finance Manager');if(cb)cb()},delay));
}
function start(){
  timers.forEach(clearTimeout);timers=[];chat.innerHTML='';
  var day=document.createElement('div');day.className='day';day.textContent='Hari ini';chat.appendChild(day);
  incoming('Our company ordered 20 office chairs.',900,function(){
    incoming('We received only 18 chairs, but the supplier billed us for 20.',1300,function(){
      incoming('Each chair costs Rp1.5 million.',1000,function(){
        incoming('What is the problem? What should we do?',1200);
      });
    });
  });
}
function send(){
  var v=msg.value.trim();if(!v)return;
  bubble(v,'out');msg.value='';
  incoming('Thank you. I have received your answer and will review it.',1200);
}
document.getElementById('send').onclick=send;
msg.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
start();
</script>
</body>
</html>
